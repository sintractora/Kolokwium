<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kolokwium</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="lewypanel">
        <h2>Lista zadań</h2>

        <a href="https://github.com/sintractora/Kolokwium" target="_blank">Link do repozytorium</a>
        <br><br>


        Opis zadania:<br>


        <textarea id="opis" maxlength="128"></textarea>

        <br><br>
        Data:<br>
    <input type="date" id="data">
        <br><br>

        <button id="zapisz">Zapisz</button>
    </div>
    
    <div id="prawypanel">
        <div id="wynik"></div>
    </div>

    <script>
        document.getElementById("zapisz").addEventListener("click", function() {
            
            let opis = document.getElementById("opis").value;
            let data = document.getElementById("data").value;

            if (opis !== "" && data !== "") {

                let Data1 = data.split("-");

            let sformatowanaData = Data1[2] + "." + Data1[1] + "." + Data1[0];

                let zad2 = document.createElement("div");
                zad2.className = "element-listy";

                zad2.innerText = sformatowanaData + " " + opis;

                document.getElementById("wynik").appendChild(zad2);

                document.getElementById("opis").value = "";
                document.getElementById("data").value = "";
            }
        });
    </script>
</body>
</html>
