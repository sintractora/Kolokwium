<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kolokwium</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <div id="lewy-panel">
        <h2>Lista zadań</h2>
        
    <a href="https://github.com/sintractora/Kolokwium" target="_blank">Link do repozytorium</a>
        <br><br>

        Opis zadania:<br>


        <textarea id="opis" maxlength="128"></textarea>
    <br><br>
        Data:<br>
    <input type="date" id="data">
        <br><br>
        <button id="zapisz">Zapisz</button>
    </div>
    
    <div id="prawypanel">
        <div id="wynik"></div>
    </div>

    <script>
        document.getElementById("zapisz").addEventListener("click", function() {
            let opis = document.getElementById("opis").value;



            let data = document.getElementById("data").value;


            if (opis !== "" && data !== "") {
                document.getElementById("wynik").innerHTML = "Zadanie: " + opis + "<br>Data: " + data;
            }
        });
    </script>
</body>
</html>
